<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mundo Binário | Programação</title>
  <style>
    
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Inter', system-ui, -apple-system, sans-serif;
  background: linear-gradient(135deg, #f5f3ff 0%, #ede9fe 50%, #ddd6fe 100%);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 20px;
  color: #4c1d95;
}
.game-card {
  background: #ffffff;
  border-radius: 20px;
  box-shadow: 0 15px 35px rgba(76, 29, 149, 0.15);
  padding: 28px;
  max-width: 560px;
  width: 100%;
  text-align: center;
  border: 2px solid #c4b5fd;
}
.header-badge {
  display: inline-block;
  background: #ede9fe;
  color: #6d28d9;
  padding: 6px 14px;
  border-radius: 20px;
  font-weight: 600;
  font-size: 13px;
  margin-bottom: 12px;
}
h1 { font-size: 26px; color: #4c1d95; margin-bottom: 8px; }
p.desc { font-size: 14px; color: #4b5563; margin-bottom: 20px; }
.stats-bar {
  display: flex;
  justify-content: space-around;
  background: #f5f3ff;
  border-radius: 12px;
  padding: 12px;
  margin-bottom: 20px;
  border: 1px solid #ddd6fe;
}
.stat-box { font-size: 14px; font-weight: 600; color: #7c3aed; }
.stat-val { font-size: 20px; font-weight: 700; color: #4c1d95; display: block; }
.btn-action {
  background: #7c3aed;
  color: white;
  border: none;
  padding: 12px 24px;
  font-size: 15px;
  font-weight: 600;
  border-radius: 10px;
  cursor: pointer;
  transition: all 0.2s;
  text-decoration: none;
  display: inline-block;
}
.btn-action:hover { background: #6d28d9; transform: translateY(-1px); }
.back-link {
  margin-top: 20px;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  color: #4c1d95;
  text-decoration: none;
  font-size: 13px;
  font-weight: 600;
}
.back-link:hover { text-decoration: underline; }

    .target-banner {
      background: #ede9fe;
      border: 2px dashed #8b5cf6;
      border-radius: 14px;
      padding: 16px;
      font-size: 20px;
      font-weight: 800;
      color: #5b21b6;
      margin-bottom: 20px;
    }
    .bits-row {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-bottom: 24px;
    }
    .bit-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }
    .bit-weight {
      font-size: 13px;
      font-weight: 700;
      color: #6d28d9;
    }
    .bit-btn {
      width: 58px;
      height: 68px;
      background: #f5f3ff;
      border: 3px solid #ddd6fe;
      border-radius: 12px;
      font-size: 24px;
      font-weight: 800;
      color: #7c3aed;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
    }
    .bit-btn.active {
      background: #7c3aed;
      color: white;
      border-color: #5b21b6;
      box-shadow: 0 0 16px rgba(124, 58, 237, 0.4);
    }
    .sum-display {
      font-size: 18px;
      font-weight: 700;
      color: #4c1d95;
      margin-bottom: 20px;
    }
  </style>
</head>
<body>
  <div class="game-card">
    <span class="header-badge">💡 Sistema de Numeração Binária</span>
    <h1>Decodificador Binário</h1>
    <p class="desc">Ligue e desligue os bits para formar o número decimal solicitado!</p>

    <div class="stats-bar">
      <div class="stat-box">Pontos<span class="stat-val" id="score">0</span></div>
      <div class="stat-box">Fase<span class="stat-val" id="level">1/6</span></div>
    </div>

    <div class="target-banner">Meta: Forme o número <span id="target-num" style="font-size: 28px; color: #7c3aed;">5</span></div>

    <div class="bits-row" id="bits-container"></div>
    <div class="sum-display">Valor Atual: <span id="current-sum" style="color: #7c3aed;">0</span></div>

    <button class="btn-action" onclick="checkAnswer()">Confirmar Valor</button>
    <br>
    <a href="../../projetos.html" class="back-link">← Voltar ao Portfólio</a>
  </div>

  <script>
    
const AudioCtx = window.AudioContext || window.webkitAudioContext;
let ctx;
function playSound(type) {
  try {
    if (!ctx) ctx = new AudioCtx();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain);
    gain.connect(ctx.destination);
    if (type === 'correct') {
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(523.25, ctx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(783.99, ctx.currentTime + 0.15);
      gain.gain.setValueAtTime(0.3, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.25);
      osc.start();
      osc.stop(ctx.currentTime + 0.25);
    } else {
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(220, ctx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(130, ctx.currentTime + 0.2);
      gain.gain.setValueAtTime(0.3, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.25);
      osc.start();
      osc.stop(ctx.currentTime + 0.25);
    }
  } catch(e) {}
}

    const weights = [8, 4, 2, 1];
    let bitsState = [0, 0, 0, 0];
    let target = 5, score = 0, level = 1;

    function renderBits() {
      const c = document.getElementById('bits-container');
      c.innerHTML = '';
      weights.forEach((w, i) => {
        const box = document.createElement('div');
        box.className = 'bit-box';
        box.innerHTML = '<span class="bit-weight">+' + w + '</span>';

        const btn = document.createElement('button');
        btn.className = 'bit-btn' + (bitsState[i] ? ' active' : '');
        btn.textContent = bitsState[i];
        btn.onclick = () => {
          bitsState[i] = bitsState[i] ? 0 : 1;
          renderBits();
        };
        box.appendChild(btn);
        c.appendChild(box);
      });

      const currentSum = bitsState.reduce((acc, bit, idx) => acc + bit * weights[idx], 0);
      document.getElementById('current-sum').textContent = currentSum;
    }

    function checkAnswer() {
      const currentSum = bitsState.reduce((acc, bit, idx) => acc + bit * weights[idx], 0);
      if (currentSum === target) {
        playSound('correct');
        score += 25;
        level++;
        document.getElementById('score').textContent = score;
        document.getElementById('level').textContent = level + '/6';
        if (level > 6) {
          alert('🎉 Incrível! Você dominou a lógica binária com maestria!');
        } else {
          target = Math.floor(Math.random() * 15) + 1;
          document.getElementById('target-num').textContent = target;
          bitsState = [0, 0, 0, 0];
          renderBits();
        }
      } else {
        playSound('wrong');
        alert('O valor atual (' + currentSum + ') não é igual à meta (' + target + '). Tente ajustar os bits!');
      }
    }

    renderBits();
  </script>
</body>
</html>
