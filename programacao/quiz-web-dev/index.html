<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz Front-end | Programação</title>
  <style>
    
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Inter', system-ui, -apple-system, sans-serif;
  background: linear-gradient(135deg, #f5f3ff 0%, #ede9fe 50%, #ddd6fe 100%);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 20px;
  color: #4c1d95;
}
.game-card {
  background: #ffffff;
  border-radius: 20px;
  box-shadow: 0 15px 35px rgba(76, 29, 149, 0.15);
  padding: 28px;
  max-width: 560px;
  width: 100%;
  text-align: center;
  border: 2px solid #c4b5fd;
}
.header-badge {
  display: inline-block;
  background: #ede9fe;
  color: #6d28d9;
  padding: 6px 14px;
  border-radius: 20px;
  font-weight: 600;
  font-size: 13px;
  margin-bottom: 12px;
}
h1 { font-size: 26px; color: #4c1d95; margin-bottom: 8px; }
p.desc { font-size: 14px; color: #4b5563; margin-bottom: 20px; }
.stats-bar {
  display: flex;
  justify-content: space-around;
  background: #f5f3ff;
  border-radius: 12px;
  padding: 12px;
  margin-bottom: 20px;
  border: 1px solid #ddd6fe;
}
.stat-box { font-size: 14px; font-weight: 600; color: #7c3aed; }
.stat-val { font-size: 20px; font-weight: 700; color: #4c1d95; display: block; }
.btn-action {
  background: #7c3aed;
  color: white;
  border: none;
  padding: 12px 24px;
  font-size: 15px;
  font-weight: 600;
  border-radius: 10px;
  cursor: pointer;
  transition: all 0.2s;
  text-decoration: none;
  display: inline-block;
}
.btn-action:hover { background: #6d28d9; transform: translateY(-1px); }
.back-link {
  margin-top: 20px;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  color: #4c1d95;
  text-decoration: none;
  font-size: 13px;
  font-weight: 600;
}
.back-link:hover { text-decoration: underline; }

    .quiz-question {
      background: #f5f3ff;
      border: 2px solid #c4b5fd;
      border-radius: 14px;
      padding: 20px;
      font-size: 18px;
      font-weight: 700;
      color: #4c1d95;
      margin-bottom: 20px;
    }
    .options-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 20px;
    }
    .dev-btn {
      background: #ffffff;
      border: 2px solid #ddd6fe;
      border-radius: 12px;
      padding: 14px 18px;
      font-size: 15px;
      font-weight: 600;
      color: #5b21b6;
      text-align: left;
      cursor: pointer;
      font-family: monospace, sans-serif;
      transition: all 0.2s;
    }
    .dev-btn:hover { background: #ede9fe; transform: translateX(4px); }
    .dev-btn.correct { background: #22c55e !important; color: white !important; border-color: #16a34a !important; }
    .dev-btn.wrong { background: #ef4444 !important; color: white !important; border-color: #dc2626 !important; }
  </style>
</head>
<body>
  <div class="game-card">
    <span class="header-badge">🌐 HTML & CSS para Iniciantes</span>
    <h1>Desafio Web Front-end</h1>
    <p class="desc">Teste seus conhecimentos em desenvolvimento web básico!</p>

    <div class="stats-bar">
      <div class="stat-box">Questão<span class="stat-val" id="q-idx">1/5</span></div>
      <div class="stat-box">Pontos<span class="stat-val" id="score">0</span></div>
    </div>

    <div class="quiz-question" id="q-text">Carregando pergunta...</div>
    <div class="options-list" id="options"></div>

    <a href="../../projetos.html" class="back-link">← Voltar ao Portfólio</a>
  </div>

  <script>
    
const AudioCtx = window.AudioContext || window.webkitAudioContext;
let ctx;
function playSound(type) {
  try {
    if (!ctx) ctx = new AudioCtx();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain);
    gain.connect(ctx.destination);
    if (type === 'correct') {
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(523.25, ctx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(783.99, ctx.currentTime + 0.15);
      gain.gain.setValueAtTime(0.3, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.25);
      osc.start();
      osc.stop(ctx.currentTime + 0.25);
    } else {
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(220, ctx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(130, ctx.currentTime + 0.2);
      gain.gain.setValueAtTime(0.3, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.25);
      osc.start();
      osc.stop(ctx.currentTime + 0.25);
    }
  } catch(e) {}
}

    const questions = [
      {
        q: 'Qual elemento HTML é utilizado para criar um link clicável para outra página?',
        correct: '<a href="...">',
        options: ['<link rel="...">', '<a href="...">', '<button to="...">', '<url path="...">']
      },
      {
        q: 'Em CSS, qual propriedade é responsável por alterar a cor do texto?',
        correct: 'color',
        options: ['text-color', 'font-color', 'color', 'background-text']
      },
      {
        q: 'Qual tag HTML define o cabeçalho/título de maior importância hierárquica?',
        correct: '<h1>',
        options: ['<header>', '<h6>', '<title>', '<h1>']
      },
      {
        q: 'Qual propriedade CSS cria um layout de grade bidimensional no container?',
        correct: 'display: grid;',
        options: ['display: flex;', 'display: grid;', 'display: block;', 'position: absolute;']
      },
      {
        q: 'Qual tag é usada para inserir uma imagem na página web?',
        correct: '<img src="...">',
        options: ['<picture link="...">', '<img src="...">', '<photo path="...">', '<image file="...">']
      }
    ];

    let current = 0, score = 0, locked = false;

    function renderQuestion() {
      locked = false;
      const q = questions[current];
      document.getElementById('q-idx').textContent = (current + 1) + '/' + questions.length;
      document.getElementById('q-text').textContent = q.q;

      const optBox = document.getElementById('options');
      optBox.innerHTML = '';
      q.options.forEach(opt => {
        const btn = document.createElement('button');
        btn.className = 'dev-btn';
        btn.textContent = opt;
        btn.onclick = () => {
          if (locked) return;
          locked = true;
          if (opt === q.correct) {
            playSound('correct');
            btn.classList.add('correct');
            score += 20;
            document.getElementById('score').textContent = score;
          } else {
            playSound('wrong');
            btn.classList.add('wrong');
          }
          setTimeout(() => {
            if (current + 1 < questions.length) {
              current++;
              renderQuestion();
            } else {
              alert('🎉 Fantástico! Você concluiu o Quiz Front-end com ' + score + ' pontos!');
            }
          }, 800);
        };
        optBox.appendChild(btn);
      });
    }

    renderQuestion();
  </script>
</body>
</html>
