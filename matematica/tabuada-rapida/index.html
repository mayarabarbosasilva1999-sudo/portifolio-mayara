<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tabuada Rápida | Jogos Educativos</title>
  <style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Inter', system-ui, -apple-system, sans-serif;
  background: linear-gradient(135deg, #f0fdf4 0%, #dcfce7 50%, #bbf7d0 100%);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 20px;
  color: #14532d;
}
.game-card {
  background: #ffffff;
  border-radius: 20px;
  box-shadow: 0 15px 35px rgba(22, 101, 52, 0.15);
  padding: 30px;
  max-width: 500px;
  width: 100%;
  text-align: center;
  border: 2px solid #86efac;
}
.header-badge {
  display: inline-block;
  background: #dcfce7;
  color: #166534;
  padding: 6px 14px;
  border-radius: 20px;
  font-weight: 600;
  font-size: 13px;
  margin-bottom: 12px;
}
h1 { font-size: 26px; color: #166534; margin-bottom: 8px; }
p.desc { font-size: 14px; color: #4b5563; margin-bottom: 20px; }
.stats-bar {
  display: flex;
  justify-content: space-around;
  background: #f0fdf4;
  border-radius: 12px;
  padding: 12px;
  margin-bottom: 24px;
  border: 1px solid #bbf7d0;
}
.stat-box { font-size: 14px; font-weight: 600; color: #15803d; }
.stat-val { font-size: 20px; font-weight: 700; color: #166534; display: block; }
.problem-box {
  background: #f0fdf4;
  border: 3px dashed #4ade80;
  border-radius: 16px;
  padding: 24px;
  font-size: 42px;
  font-weight: 800;
  color: #166534;
  margin-bottom: 24px;
  letter-spacing: 2px;
}
.options-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin-bottom: 20px;
}
.btn-opt {
  background: #ffffff;
  border: 2px solid #86efac;
  border-radius: 14px;
  padding: 16px;
  font-size: 22px;
  font-weight: 700;
  color: #166534;
  cursor: pointer;
  transition: all 0.15s ease;
}
.btn-opt:hover {
  background: #bbf7d0;
  transform: translateY(-2px);
  border-color: #22c55e;
}
.btn-opt:active { transform: translateY(0); }
.btn-opt.correct { background: #22c55e !important; color: white !important; border-color: #16a34a !important; }
.btn-opt.wrong { background: #ef4444 !important; color: white !important; border-color: #dc2626 !important; }
.btn-action {
  background: #16a34a;
  color: white;
  border: none;
  padding: 12px 24px;
  font-size: 15px;
  font-weight: 600;
  border-radius: 10px;
  cursor: pointer;
  transition: all 0.2s;
  text-decoration: none;
  display: inline-block;
}
.btn-action:hover { background: #15803d; transform: translateY(-1px); }
.back-link {
  margin-top: 20px;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  color: #166534;
  text-decoration: none;
  font-size: 13px;
  font-weight: 600;
}
.back-link:hover { text-decoration: underline; }
</style>
</head>
<body>
  <div class="game-card">
    <span class="header-badge">🔢 Matemática Interativa</span>
    <h1>Tabuada Rápida</h1>
    <p class="desc">Treine a sua agilidade mental resolvendo o cálculo antes que o tempo esgote!</p>

    <div class="stats-bar">
      <div class="stat-box">Tempo<span class="stat-val" id="timer">30s</span></div>
      <div class="stat-box">Pontos<span class="stat-val" id="score">0</span></div>
      <div class="stat-box">Sequência<span class="stat-val" id="streak">0 🔥</span></div>
    </div>

    <div class="problem-box" id="problem">7 × 8 = ?</div>
    <div class="options-grid" id="options"></div>

    <div id="game-over" style="display:none; margin-bottom: 20px;">
      <h2 style="color: #15803d; margin-bottom: 8px;">Tempo esgotado! 🎉</h2>
      <p style="font-size: 15px; color: #374151; margin-bottom: 16px;">Sua pontuação final foi: <strong id="final-score">0</strong></p>
      <button class="btn-action" onclick="startGame()">Jogar Novamente</button>
    </div>

    <a href="../../projetos.html" class="back-link">← Voltar ao Portfólio</a>
  </div>

  <script>
    
const AudioCtx = window.AudioContext || window.webkitAudioContext;
let ctx;
function playSound(type) {
  try {
    if (!ctx) ctx = new AudioCtx();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain);
    gain.connect(ctx.destination);
    if (type === 'correct') {
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(523.25, ctx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(783.99, ctx.currentTime + 0.15);
      gain.gain.setValueAtTime(0.3, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.25);
      osc.start();
      osc.stop(ctx.currentTime + 0.25);
    } else {
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(220, ctx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(130, ctx.currentTime + 0.2);
      gain.gain.setValueAtTime(0.3, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.25);
      osc.start();
      osc.stop(ctx.currentTime + 0.25);
    }
  } catch(e) {}
}

    let score = 0, streak = 0, timeLeft = 30, timerInterval, currentAnswer = 0, isLocked = false;

    function nextProblem() {
      if (timeLeft <= 0) return;
      isLocked = false;
      const n1 = Math.floor(Math.random() * 9) + 2;
      const n2 = Math.floor(Math.random() * 9) + 2;
      currentAnswer = n1 * n2;
      document.getElementById('problem').textContent = n1 + ' × ' + n2 + ' = ?';

      const options = new Set([currentAnswer]);
      while (options.size < 4) {
        const offset = (Math.floor(Math.random() * 5) + 1) * (Math.random() > 0.5 ? 1 : -1);
        const wrong = Math.max(2, currentAnswer + offset);
        options.add(wrong);
      }

      const shuffled = Array.from(options).sort(() => Math.random() - 0.5);
      const grid = document.getElementById('options');
      grid.innerHTML = '';
      shuffled.forEach(opt => {
        const btn = document.createElement('button');
        btn.className = 'btn-opt';
        btn.textContent = opt;
        btn.onclick = () => selectOption(opt, btn);
        grid.appendChild(btn);
      });
    }

    function selectOption(opt, btn) {
      if (isLocked || timeLeft <= 0) return;
      isLocked = true;
      if (opt === currentAnswer) {
        playSound('correct');
        score += 10 + streak * 2;
        streak++;
        btn.classList.add('correct');
        document.getElementById('score').textContent = score;
        document.getElementById('streak').textContent = streak + ' 🔥';
        setTimeout(nextProblem, 400);
      } else {
        playSound('wrong');
        streak = 0;
        btn.classList.add('wrong');
        document.getElementById('streak').textContent = '0 🔥';
        setTimeout(nextProblem, 500);
      }
    }

    function startGame() {
      score = 0; streak = 0; timeLeft = 30;
      document.getElementById('score').textContent = '0';
      document.getElementById('streak').textContent = '0 🔥';
      document.getElementById('timer').textContent = '30s';
      document.getElementById('game-over').style.display = 'none';
      document.getElementById('options').style.display = 'grid';
      document.getElementById('problem').style.display = 'block';

      clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        timeLeft--;
        document.getElementById('timer').textContent = timeLeft + 's';
        if (timeLeft <= 0) {
          clearInterval(timerInterval);
          document.getElementById('options').style.display = 'none';
          document.getElementById('problem').style.display = 'none';
          document.getElementById('final-score').textContent = score;
          document.getElementById('game-over').style.display = 'block';
        }
      }, 1000);

      nextProblem();
    }
    startGame();
  </script>
</body>
</html>
