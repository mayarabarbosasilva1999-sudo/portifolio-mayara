<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mestre das Contas | Jogos Educativos</title>
  <style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Inter', system-ui, -apple-system, sans-serif;
  background: linear-gradient(135deg, #f0fdf4 0%, #dcfce7 50%, #bbf7d0 100%);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 20px;
  color: #14532d;
}
.game-card {
  background: #ffffff;
  border-radius: 20px;
  box-shadow: 0 15px 35px rgba(22, 101, 52, 0.15);
  padding: 30px;
  max-width: 500px;
  width: 100%;
  text-align: center;
  border: 2px solid #86efac;
}
.header-badge {
  display: inline-block;
  background: #dcfce7;
  color: #166534;
  padding: 6px 14px;
  border-radius: 20px;
  font-weight: 600;
  font-size: 13px;
  margin-bottom: 12px;
}
h1 { font-size: 26px; color: #166534; margin-bottom: 8px; }
p.desc { font-size: 14px; color: #4b5563; margin-bottom: 20px; }
.stats-bar {
  display: flex;
  justify-content: space-around;
  background: #f0fdf4;
  border-radius: 12px;
  padding: 12px;
  margin-bottom: 24px;
  border: 1px solid #bbf7d0;
}
.stat-box { font-size: 14px; font-weight: 600; color: #15803d; }
.stat-val { font-size: 20px; font-weight: 700; color: #166534; display: block; }
.problem-box {
  background: #f0fdf4;
  border: 3px dashed #4ade80;
  border-radius: 16px;
  padding: 24px;
  font-size: 42px;
  font-weight: 800;
  color: #166534;
  margin-bottom: 24px;
  letter-spacing: 2px;
}
.options-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin-bottom: 20px;
}
.btn-opt {
  background: #ffffff;
  border: 2px solid #86efac;
  border-radius: 14px;
  padding: 16px;
  font-size: 22px;
  font-weight: 700;
  color: #166534;
  cursor: pointer;
  transition: all 0.15s ease;
}
.btn-opt:hover {
  background: #bbf7d0;
  transform: translateY(-2px);
  border-color: #22c55e;
}
.btn-opt:active { transform: translateY(0); }
.btn-opt.correct { background: #22c55e !important; color: white !important; border-color: #16a34a !important; }
.btn-opt.wrong { background: #ef4444 !important; color: white !important; border-color: #dc2626 !important; }
.btn-action {
  background: #16a34a;
  color: white;
  border: none;
  padding: 12px 24px;
  font-size: 15px;
  font-weight: 600;
  border-radius: 10px;
  cursor: pointer;
  transition: all 0.2s;
  text-decoration: none;
  display: inline-block;
}
.btn-action:hover { background: #15803d; transform: translateY(-1px); }
.back-link {
  margin-top: 20px;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  color: #166534;
  text-decoration: none;
  font-size: 13px;
  font-weight: 600;
}
.back-link:hover { text-decoration: underline; }
</style>
</head>
<body>
  <div class="game-card">
    <span class="header-badge">➕ Mestre da Aritmética</span>
    <h1>Soma & Subtração</h1>
    <p class="desc">Resolva as operações matemáticas para bater o recorde!</p>

    <div class="stats-bar">
      <div class="stat-box">Acertos<span class="stat-val" id="corrects">0</span></div>
      <div class="stat-box">Nível<span class="stat-val" id="level">1</span></div>
      <div class="stat-box">Pontuação<span class="stat-val" id="score">0</span></div>
    </div>

    <div class="problem-box" id="problem">25 + 14 = ?</div>
    <div class="options-grid" id="options"></div>

    <a href="../../projetos.html" class="back-link">← Voltar ao Portfólio</a>
  </div>

  <script>
    
const AudioCtx = window.AudioContext || window.webkitAudioContext;
let ctx;
function playSound(type) {
  try {
    if (!ctx) ctx = new AudioCtx();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain);
    gain.connect(ctx.destination);
    if (type === 'correct') {
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(523.25, ctx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(783.99, ctx.currentTime + 0.15);
      gain.gain.setValueAtTime(0.3, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.25);
      osc.start();
      osc.stop(ctx.currentTime + 0.25);
    } else {
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(220, ctx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(130, ctx.currentTime + 0.2);
      gain.gain.setValueAtTime(0.3, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.25);
      osc.start();
      osc.stop(ctx.currentTime + 0.25);
    }
  } catch(e) {}
}

    let corrects = 0, score = 0, level = 1, currentAnswer = 0, locked = false;

    function nextQuestion() {
      locked = false;
      const isSum = Math.random() > 0.5;
      const maxVal = level * 15 + 10;
      let a = Math.floor(Math.random() * maxVal) + 5;
      let b = Math.floor(Math.random() * maxVal) + 5;

      if (!isSum && b > a) { const tmp = a; a = b; b = tmp; }
      currentAnswer = isSum ? a + b : a - b;
      document.getElementById('problem').textContent = a + (isSum ? ' + ' : ' − ') + b + ' = ?';

      const opts = new Set([currentAnswer]);
      while (opts.size < 4) {
        const off = (Math.floor(Math.random() * 4) + 1) * (Math.random() > 0.5 ? 1 : -1);
        opts.add(Math.max(0, currentAnswer + off));
      }

      const container = document.getElementById('options');
      container.innerHTML = '';
      Array.from(opts).sort(() => Math.random() - 0.5).forEach(val => {
        const btn = document.createElement('button');
        btn.className = 'btn-opt';
        btn.textContent = val;
        btn.onclick = () => {
          if (locked) return;
          locked = true;
          if (val === currentAnswer) {
            playSound('correct');
            btn.classList.add('correct');
            corrects++;
            score += 15 * level;
            if (corrects % 5 === 0) level++;
            document.getElementById('corrects').textContent = corrects;
            document.getElementById('score').textContent = score;
            document.getElementById('level').textContent = level;
            setTimeout(nextQuestion, 400);
          } else {
            playSound('wrong');
            btn.classList.add('wrong');
            setTimeout(nextQuestion, 500);
          }
        };
        container.appendChild(btn);
      });
    }
    nextQuestion();
  </script>
</body>
</html>
