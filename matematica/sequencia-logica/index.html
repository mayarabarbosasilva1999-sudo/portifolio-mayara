<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sequência Lógica | Jogos Educativos</title>
  <style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Inter', system-ui, -apple-system, sans-serif;
  background: linear-gradient(135deg, #f0fdf4 0%, #dcfce7 50%, #bbf7d0 100%);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 20px;
  color: #14532d;
}
.game-card {
  background: #ffffff;
  border-radius: 20px;
  box-shadow: 0 15px 35px rgba(22, 101, 52, 0.15);
  padding: 30px;
  max-width: 500px;
  width: 100%;
  text-align: center;
  border: 2px solid #86efac;
}
.header-badge {
  display: inline-block;
  background: #dcfce7;
  color: #166534;
  padding: 6px 14px;
  border-radius: 20px;
  font-weight: 600;
  font-size: 13px;
  margin-bottom: 12px;
}
h1 { font-size: 26px; color: #166534; margin-bottom: 8px; }
p.desc { font-size: 14px; color: #4b5563; margin-bottom: 20px; }
.stats-bar {
  display: flex;
  justify-content: space-around;
  background: #f0fdf4;
  border-radius: 12px;
  padding: 12px;
  margin-bottom: 24px;
  border: 1px solid #bbf7d0;
}
.stat-box { font-size: 14px; font-weight: 600; color: #15803d; }
.stat-val { font-size: 20px; font-weight: 700; color: #166534; display: block; }
.problem-box {
  background: #f0fdf4;
  border: 3px dashed #4ade80;
  border-radius: 16px;
  padding: 24px;
  font-size: 42px;
  font-weight: 800;
  color: #166534;
  margin-bottom: 24px;
  letter-spacing: 2px;
}
.options-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin-bottom: 20px;
}
.btn-opt {
  background: #ffffff;
  border: 2px solid #86efac;
  border-radius: 14px;
  padding: 16px;
  font-size: 22px;
  font-weight: 700;
  color: #166534;
  cursor: pointer;
  transition: all 0.15s ease;
}
.btn-opt:hover {
  background: #bbf7d0;
  transform: translateY(-2px);
  border-color: #22c55e;
}
.btn-opt:active { transform: translateY(0); }
.btn-opt.correct { background: #22c55e !important; color: white !important; border-color: #16a34a !important; }
.btn-opt.wrong { background: #ef4444 !important; color: white !important; border-color: #dc2626 !important; }
.btn-action {
  background: #16a34a;
  color: white;
  border: none;
  padding: 12px 24px;
  font-size: 15px;
  font-weight: 600;
  border-radius: 10px;
  cursor: pointer;
  transition: all 0.2s;
  text-decoration: none;
  display: inline-block;
}
.btn-action:hover { background: #15803d; transform: translateY(-1px); }
.back-link {
  margin-top: 20px;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  color: #166534;
  text-decoration: none;
  font-size: 13px;
  font-weight: 600;
}
.back-link:hover { text-decoration: underline; }
</style>
</head>
<body>
  <div class="game-card">
    <span class="header-badge">🔍 Raciocínio Lógico</span>
    <h1>Detetive de Padrões</h1>
    <p class="desc">Descubra qual é o próximo número da sequência lógica!</p>

    <div class="stats-bar">
      <div class="stat-box">Fase<span class="stat-val" id="stage">1/10</span></div>
      <div class="stat-box">Pontos<span class="stat-val" id="score">0</span></div>
      <div class="stat-box">Dica<span class="stat-val" id="tip">Padrão</span></div>
    </div>

    <div class="problem-box" id="sequence" style="font-size: 28px;">2, 4, 6, 8, ?</div>
    <div class="options-grid" id="options"></div>

    <a href="../../projetos.html" class="back-link">← Voltar ao Portfólio</a>
  </div>

  <script>
    
const AudioCtx = window.AudioContext || window.webkitAudioContext;
let ctx;
function playSound(type) {
  try {
    if (!ctx) ctx = new AudioCtx();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain);
    gain.connect(ctx.destination);
    if (type === 'correct') {
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(523.25, ctx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(783.99, ctx.currentTime + 0.15);
      gain.gain.setValueAtTime(0.3, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.25);
      osc.start();
      osc.stop(ctx.currentTime + 0.25);
    } else {
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(220, ctx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(130, ctx.currentTime + 0.2);
      gain.gain.setValueAtTime(0.3, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.25);
      osc.start();
      osc.stop(ctx.currentTime + 0.25);
    }
  } catch(e) {}
}

    let stage = 1, score = 0, curAns = 0, locked = false;

    const patterns = [
      () => { const s = Math.floor(Math.random()*5)+1, step = Math.floor(Math.random()*4)+2; return { seq: [s, s+step, s+step*2, s+step*3], ans: s+step*4, tip: '+' + step }; },
      () => { const s = Math.floor(Math.random()*3)+1; return { seq: [s, s*2, s*4, s*8], ans: s*16, tip: '×2' }; },
      () => { const s = Math.floor(Math.random()*5)+20, step = Math.floor(Math.random()*4)+3; return { seq: [s, s-step, s-step*2, s-step*3], ans: s-step*4, tip: '-' + step }; },
      () => { return { seq: [1, 4, 9, 16], ans: 25, tip: 'Quadrados' }; }
    ];

    function nextSequence() {
      locked = false;
      const gen = patterns[Math.floor(Math.random() * patterns.length)];
      const p = gen();
      curAns = p.ans;
      document.getElementById('sequence').textContent = p.seq.join(', ') + ', ?';
      document.getElementById('tip').textContent = p.tip;

      const opts = new Set([curAns]);
      while (opts.size < 4) {
        const off = (Math.floor(Math.random()*4)+1) * (Math.random() > 0.5 ? 1 : -1);
        opts.add(curAns + off);
      }

      const container = document.getElementById('options');
      container.innerHTML = '';
      Array.from(opts).sort(() => Math.random() - 0.5).forEach(v => {
        const btn = document.createElement('button');
        btn.className = 'btn-opt';
        btn.textContent = v;
        btn.onclick = () => {
          if (locked) return;
          locked = true;
          if (v === curAns) {
            playSound('correct');
            score += 20;
            stage++;
            btn.classList.add('correct');
          } else {
            playSound('wrong');
            btn.classList.add('wrong');
          }
          document.getElementById('score').textContent = score;
          document.getElementById('stage').textContent = stage + '/10';
          setTimeout(nextSequence, 500);
        };
        container.appendChild(btn);
      });
    }
    nextSequence();
  </script>
</body>
</html>
