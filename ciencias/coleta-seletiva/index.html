<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coleta Seletiva | Ciências</title>
  <style>
    
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Inter', system-ui, -apple-system, sans-serif;
  background: linear-gradient(135deg, #fefce8 0%, #fef08a 50%, #fde047 100%);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 20px;
  color: #713f12;
}
.game-card {
  background: #ffffff;
  border-radius: 20px;
  box-shadow: 0 15px 35px rgba(113, 63, 18, 0.15);
  padding: 28px;
  max-width: 560px;
  width: 100%;
  text-align: center;
  border: 2px solid #facc15;
}
.header-badge {
  display: inline-block;
  background: #fef08a;
  color: #854d0e;
  padding: 6px 14px;
  border-radius: 20px;
  font-weight: 600;
  font-size: 13px;
  margin-bottom: 12px;
}
h1 { font-size: 26px; color: #713f12; margin-bottom: 8px; }
p.desc { font-size: 14px; color: #4b5563; margin-bottom: 20px; }
.stats-bar {
  display: flex;
  justify-content: space-around;
  background: #fefce8;
  border-radius: 12px;
  padding: 12px;
  margin-bottom: 20px;
  border: 1px solid #fef08a;
}
.stat-box { font-size: 14px; font-weight: 600; color: #a16207; }
.stat-val { font-size: 20px; font-weight: 700; color: #713f12; display: block; }
.btn-action {
  background: #eab308;
  color: #422006;
  border: none;
  padding: 12px 24px;
  font-size: 15px;
  font-weight: 700;
  border-radius: 10px;
  cursor: pointer;
  transition: all 0.2s;
  text-decoration: none;
  display: inline-block;
}
.btn-action:hover { background: #ca8a04; transform: translateY(-1px); color: white; }
.back-link {
  margin-top: 20px;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  color: #713f12;
  text-decoration: none;
  font-size: 13px;
  font-weight: 600;
}
.back-link:hover { text-decoration: underline; }

    .item-display {
      background: #fefce8;
      border: 3px dashed #ca8a04;
      border-radius: 16px;
      padding: 20px;
      font-size: 24px;
      font-weight: 800;
      color: #713f12;
      margin-bottom: 24px;
    }
    .bins-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin-bottom: 20px;
    }
    .bin-btn {
      border: none;
      border-radius: 12px;
      padding: 16px 8px;
      color: white;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }
    .bin-btn:hover { transform: translateY(-3px); filter: brightness(1.1); }
    .bin-plastic { background: #ef4444; }
    .bin-paper { background: #3b82f6; }
    .bin-metal { background: #eab308; }
    .bin-glass { background: #22c55e; }
  </style>
</head>
<body>
  <div class="game-card">
    <span class="header-badge">♻️ Meio Ambiente & Reciclagem</span>
    <h1>Coleta Seletiva</h1>
    <p class="desc">Em qual lixeira este resíduo deve ser descartado corretamente?</p>

    <div class="stats-bar">
      <div class="stat-box">Pontos<span class="stat-val" id="score">0</span></div>
      <div class="stat-box">Itens<span class="stat-val" id="prog">1/8</span></div>
      <div class="stat-box">Vidas<span class="stat-val" id="lives">❤️❤️❤️</span></div>
    </div>

    <div class="item-display" id="item-box">🍾 Garrafa de Refrigerante Pet</div>

    <div class="bins-grid">
      <button class="bin-btn bin-plastic" onclick="pickBin('plastico')">
        <span style="font-size: 24px;">🔴</span>Plástico
      </button>
      <button class="bin-btn bin-paper" onclick="pickBin('papel')">
        <span style="font-size: 24px;">🔵</span>Papel
      </button>
      <button class="bin-btn bin-metal" onclick="pickBin('metal')">
        <span style="font-size: 24px;">🟡</span>Metal
      </button>
      <button class="bin-btn bin-glass" onclick="pickBin('vidro')">
        <span style="font-size: 24px;">🟢</span>Vidro
      </button>
    </div>

    <a href="../../projetos.html" class="back-link">← Voltar ao Portfólio</a>
  </div>

  <script>
    
const AudioCtx = window.AudioContext || window.webkitAudioContext;
let ctx;
function playSound(type) {
  try {
    if (!ctx) ctx = new AudioCtx();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain);
    gain.connect(ctx.destination);
    if (type === 'correct') {
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(523.25, ctx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(783.99, ctx.currentTime + 0.15);
      gain.gain.setValueAtTime(0.3, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.25);
      osc.start();
      osc.stop(ctx.currentTime + 0.25);
    } else {
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(220, ctx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(130, ctx.currentTime + 0.2);
      gain.gain.setValueAtTime(0.3, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.25);
      osc.start();
      osc.stop(ctx.currentTime + 0.25);
    }
  } catch(e) {}
}

    const items = [
      { name: '🧴 Garrafa de Shampoo Plástica', type: 'plastico' },
      { name: '📰 Jornal Velho', type: 'papel' },
      { name: '🥫 Lata de Milho em Conserva', type: 'metal' },
      { name: '🍷 Pote de Geléia de Vidro', type: 'vidro' },
      { name: '🥤 Copo Descartável', type: 'plastico' },
      { name: '📦 Caixa de Papelão', type: 'papel' },
      { name: '🪙 Tampa de Metal de Garrafa', type: 'metal' },
      { name: '🍶 Frasco de Perfume de Vidro', type: 'vidro' }
    ];

    let curIdx = 0, score = 0, lives = 3, locked = false;

    function renderItem() {
      locked = false;
      const it = items[curIdx];
      document.getElementById('item-box').textContent = it.name;
      document.getElementById('prog').textContent = (curIdx + 1) + '/' + items.length;
      document.getElementById('lives').textContent = '❤️'.repeat(lives) || '💀';
      document.getElementById('score').textContent = score;
    }

    function pickBin(type) {
      if (locked) return;
      locked = true;
      if (items[curIdx].type === type) {
        playSound('correct');
        score += 20;
        curIdx++;
        if (curIdx < items.length) {
          renderItem();
        } else {
          document.getElementById('score').textContent = score;
          alert('🎉 Excelente trabalho! Você separou todos os materiais recicláveis com perfeição!');
        }
      } else {
        playSound('wrong');
        lives--;
        if (lives <= 0) {
          alert('Ops! Vidas esgotadas. Tente novamente!');
          lives = 3;
          curIdx = 0;
          score = 0;
        }
        renderItem();
      }
    }

    renderItem();
  </script>
</body>
</html>
