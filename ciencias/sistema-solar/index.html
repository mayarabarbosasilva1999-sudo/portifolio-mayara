<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Explorador do Sistema Solar | Ciências</title>
  <style>
    
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Inter', system-ui, -apple-system, sans-serif;
  background: linear-gradient(135deg, #fefce8 0%, #fef08a 50%, #fde047 100%);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 20px;
  color: #713f12;
}
.game-card {
  background: #ffffff;
  border-radius: 20px;
  box-shadow: 0 15px 35px rgba(113, 63, 18, 0.15);
  padding: 28px;
  max-width: 560px;
  width: 100%;
  text-align: center;
  border: 2px solid #facc15;
}
.header-badge {
  display: inline-block;
  background: #fef08a;
  color: #854d0e;
  padding: 6px 14px;
  border-radius: 20px;
  font-weight: 600;
  font-size: 13px;
  margin-bottom: 12px;
}
h1 { font-size: 26px; color: #713f12; margin-bottom: 8px; }
p.desc { font-size: 14px; color: #4b5563; margin-bottom: 20px; }
.stats-bar {
  display: flex;
  justify-content: space-around;
  background: #fefce8;
  border-radius: 12px;
  padding: 12px;
  margin-bottom: 20px;
  border: 1px solid #fef08a;
}
.stat-box { font-size: 14px; font-weight: 600; color: #a16207; }
.stat-val { font-size: 20px; font-weight: 700; color: #713f12; display: block; }
.btn-action {
  background: #eab308;
  color: #422006;
  border: none;
  padding: 12px 24px;
  font-size: 15px;
  font-weight: 700;
  border-radius: 10px;
  cursor: pointer;
  transition: all 0.2s;
  text-decoration: none;
  display: inline-block;
}
.btn-action:hover { background: #ca8a04; transform: translateY(-1px); color: white; }
.back-link {
  margin-top: 20px;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  color: #713f12;
  text-decoration: none;
  font-size: 13px;
  font-weight: 600;
}
.back-link:hover { text-decoration: underline; }

    .clue-container {
      background: #fefce8;
      border: 2px solid #facc15;
      border-radius: 14px;
      padding: 16px;
      font-size: 16px;
      font-weight: 600;
      color: #713f12;
      margin-bottom: 20px;
      min-height: 50px;
    }
    .planets-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 20px;
    }
    .planet-btn {
      background: #ffffff;
      border: 2px solid #facc15;
      border-radius: 12px;
      padding: 14px;
      font-size: 16px;
      font-weight: 700;
      color: #713f12;
      cursor: pointer;
      transition: all 0.15s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .planet-btn:hover { background: #fef08a; transform: translateY(-2px); }
    .planet-btn.correct { background: #22c55e !important; color: white !important; border-color: #16a34a !important; }
    .planet-btn.wrong { background: #ef4444 !important; color: white !important; border-color: #dc2626 !important; }
  </style>
</head>
<body>
  <div class="game-card">
    <span class="header-badge">🪐 Astronomia & Exploração</span>
    <h1>Explorador Espacial</h1>
    <p class="desc">Qual planeta corresponde à descrição científica abaixo?</p>

    <div class="stats-bar">
      <div class="stat-box">Missão<span class="stat-val" id="mission">1/5</span></div>
      <div class="stat-box">Pontos<span class="stat-val" id="score">0</span></div>
    </div>

    <div class="clue-container" id="clue">Carregando...</div>
    <div class="planets-grid" id="options"></div>

    <a href="../../projetos.html" class="back-link">← Voltar ao Portfólio</a>
  </div>

  <script>
    
const AudioCtx = window.AudioContext || window.webkitAudioContext;
let ctx;
function playSound(type) {
  try {
    if (!ctx) ctx = new AudioCtx();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain);
    gain.connect(ctx.destination);
    if (type === 'correct') {
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(523.25, ctx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(783.99, ctx.currentTime + 0.15);
      gain.gain.setValueAtTime(0.3, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.25);
      osc.start();
      osc.stop(ctx.currentTime + 0.25);
    } else {
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(220, ctx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(130, ctx.currentTime + 0.2);
      gain.gain.setValueAtTime(0.3, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.25);
      osc.start();
      osc.stop(ctx.currentTime + 0.25);
    }
  } catch(e) {}
}

    const planetsData = [
      {
        desc: '🚀 Sou o maior planeta de todo o Sistema Solar e possuo a famosa "Grande Mancha Vermelha".',
        correct: 'Júpiter',
        icon: '🪐',
        options: ['Júpiter', 'Saturno', 'Marte', 'Terra']
      },
      {
        desc: '🔴 Sou conhecido como o Planeta Vermelho devido ao óxido de ferro em minha superfície.',
        correct: 'Marte',
        icon: '🔴',
        options: ['Vênus', 'Marte', 'Mercúrio', 'Júpiter']
      },
      {
        desc: '💫 Sou famoso por possuir um espetacular e brilhante sistema de anéis visíveis da Terra.',
        correct: 'Saturno',
        icon: '🪐',
        options: ['Urano', 'Saturno', 'Netuno', 'Marte']
      },
      {
        desc: '☀️ Sou o planeta mais próximo do Sol e o menor entre os planetas rochosos.',
        correct: 'Mercúrio',
        icon: '🌑',
        options: ['Mercúrio', 'Vênus', 'Terra', 'Marte']
      },
      {
        desc: '🌊 Sou o oitavo e mais distante planeta do Sol, com coloração azulada e ventos ultra-rápidos.',
        correct: 'Netuno',
        icon: '🔵',
        options: ['Netuno', 'Urano', 'Júpiter', 'Saturno']
      }
    ];

    let step = 0, score = 0, locked = false;

    function renderMission() {
      locked = false;
      const cur = planetsData[step];
      document.getElementById('mission').textContent = (step + 1) + '/' + planetsData.length;
      document.getElementById('clue').textContent = cur.desc;

      const container = document.getElementById('options');
      container.innerHTML = '';
      cur.options.forEach(opt => {
        const btn = document.createElement('button');
        btn.className = 'planet-btn';
        btn.textContent = opt;
        btn.onclick = () => {
          if (locked) return;
          locked = true;
          if (opt === cur.correct) {
            playSound('correct');
            btn.classList.add('correct');
            score += 30;
            document.getElementById('score').textContent = score;
          } else {
            playSound('wrong');
            btn.classList.add('wrong');
          }
          setTimeout(() => {
            if (step + 1 < planetsData.length) {
              step++;
              renderMission();
            } else {
              alert('🎉 Missão concluída com sucesso, astronauta! Pontuação final: ' + score);
            }
          }, 800);
        };
        container.appendChild(btn);
      });
    }

    renderMission();
  </script>
</body>
</html>
