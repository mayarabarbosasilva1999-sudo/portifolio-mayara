<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anatomia do Corpo Humano | Ciências</title>
  <style>
    
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Inter', system-ui, -apple-system, sans-serif;
  background: linear-gradient(135deg, #fefce8 0%, #fef08a 50%, #fde047 100%);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 20px;
  color: #713f12;
}
.game-card {
  background: #ffffff;
  border-radius: 20px;
  box-shadow: 0 15px 35px rgba(113, 63, 18, 0.15);
  padding: 28px;
  max-width: 560px;
  width: 100%;
  text-align: center;
  border: 2px solid #facc15;
}
.header-badge {
  display: inline-block;
  background: #fef08a;
  color: #854d0e;
  padding: 6px 14px;
  border-radius: 20px;
  font-weight: 600;
  font-size: 13px;
  margin-bottom: 12px;
}
h1 { font-size: 26px; color: #713f12; margin-bottom: 8px; }
p.desc { font-size: 14px; color: #4b5563; margin-bottom: 20px; }
.stats-bar {
  display: flex;
  justify-content: space-around;
  background: #fefce8;
  border-radius: 12px;
  padding: 12px;
  margin-bottom: 20px;
  border: 1px solid #fef08a;
}
.stat-box { font-size: 14px; font-weight: 600; color: #a16207; }
.stat-val { font-size: 20px; font-weight: 700; color: #713f12; display: block; }
.btn-action {
  background: #eab308;
  color: #422006;
  border: none;
  padding: 12px 24px;
  font-size: 15px;
  font-weight: 700;
  border-radius: 10px;
  cursor: pointer;
  transition: all 0.2s;
  text-decoration: none;
  display: inline-block;
}
.btn-action:hover { background: #ca8a04; transform: translateY(-1px); color: white; }
.back-link {
  margin-top: 20px;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  color: #713f12;
  text-decoration: none;
  font-size: 13px;
  font-weight: 600;
}
.back-link:hover { text-decoration: underline; }

    .organ-box {
      background: #fefce8;
      border: 3px dashed #ca8a04;
      border-radius: 16px;
      padding: 20px;
      font-size: 26px;
      font-weight: 800;
      color: #713f12;
      margin-bottom: 20px;
    }
    .functions-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 20px;
    }
    .func-btn {
      background: #ffffff;
      border: 2px solid #facc15;
      border-radius: 12px;
      padding: 14px 18px;
      font-size: 15px;
      font-weight: 600;
      color: #713f12;
      text-align: left;
      cursor: pointer;
      transition: all 0.2s;
    }
    .func-btn:hover { background: #fef08a; transform: translateX(4px); }
    .func-btn.correct { background: #22c55e !important; color: white !important; border-color: #16a34a !important; }
    .func-btn.wrong { background: #ef4444 !important; color: white !important; border-color: #dc2626 !important; }
  </style>
</head>
<body>
  <div class="game-card">
    <span class="header-badge">🫀 Biologia & Saúde</span>
    <h1>Órgãos do Corpo Humano</h1>
    <p class="desc">Qual é a função principal deste órgão no nosso organismo?</p>

    <div class="stats-bar">
      <div class="stat-box">Órgão<span class="stat-val" id="count">1/5</span></div>
      <div class="stat-box">Pontos<span class="stat-val" id="score">0</span></div>
    </div>

    <div class="organ-box" id="organ-name">🫀 Coração</div>
    <div class="functions-list" id="options"></div>

    <a href="../../projetos.html" class="back-link">← Voltar ao Portfólio</a>
  </div>

  <script>
    
const AudioCtx = window.AudioContext || window.webkitAudioContext;
let ctx;
function playSound(type) {
  try {
    if (!ctx) ctx = new AudioCtx();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain);
    gain.connect(ctx.destination);
    if (type === 'correct') {
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(523.25, ctx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(783.99, ctx.currentTime + 0.15);
      gain.gain.setValueAtTime(0.3, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.25);
      osc.start();
      osc.stop(ctx.currentTime + 0.25);
    } else {
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(220, ctx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(130, ctx.currentTime + 0.2);
      gain.gain.setValueAtTime(0.3, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.25);
      osc.start();
      osc.stop(ctx.currentTime + 0.25);
    }
  } catch(e) {}
}

    const organs = [
      {
        name: '🫀 Coração',
        correct: 0,
        options: [
          'Bombear sangue rico em oxigênio e nutrientes para todo o corpo.',
          'Realizar a digestão química dos alimentos sólidos.',
          'Filtrar as toxinas e produzir urina.'
        ]
      },
      {
        name: '🫁 Pulmões',
        correct: 1,
        options: [
          'Produzir hormônios como a insulina para controlar o açúcar.',
          'Realizar a troca gasosa: absorver oxigênio e expelir gás carbônico.',
          'Armazenar memórias e coordenar os movimentos musculares.'
        ]
      },
      {
        name: '🧠 Cérebro',
        correct: 2,
        options: [
          'Bombear linfa através dos vasos sanguíneos.',
          'Filtrar impurezas da água consumida.',
          'Coordenar os pensamentos, sentidos, memórias e controle do corpo.'
        ]
      },
      {
        name: '🥣 Estômago',
        correct: 0,
        options: [
          'Produzir ácido gástrico e enzimas para digerir os alimentos.',
          'Transportar oxigênio aos músculos.',
          'Regular a temperatura através da transpiração.'
        ]
      },
      {
        name: '🫘 Rins',
        correct: 1,
        options: [
          'Produzir glóbulos vermelhos para a medula.',
          'Filtrar o sangue, remover resíduos tóxicos e produzir a urina.',
          'Produzir saliva para facilitar a mastigação.'
        ]
      }
    ];

    let current = 0, score = 0, locked = false;

    function renderOrgan() {
      locked = false;
      const o = organs[current];
      document.getElementById('count').textContent = (current + 1) + '/' + organs.length;
      document.getElementById('organ-name').textContent = o.name;

      const optBox = document.getElementById('options');
      optBox.innerHTML = '';
      o.options.forEach((opt, idx) => {
        const btn = document.createElement('button');
        btn.className = 'func-btn';
        btn.textContent = opt;
        btn.onclick = () => {
          if (locked) return;
          locked = true;
          if (idx === o.correct) {
            playSound('correct');
            btn.classList.add('correct');
            score += 25;
            document.getElementById('score').textContent = score;
          } else {
            playSound('wrong');
            btn.classList.add('wrong');
          }
          setTimeout(() => {
            if (current + 1 < organs.length) {
              current++;
              renderOrgan();
            } else {
              alert('🎉 Parabéns! Você concluiu os estudos sobre a anatomia humana!');
            }
          }, 800);
        };
        optBox.appendChild(btn);
      });
    }

    renderOrgan();
  </script>
</body>
</html>
