<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadeia Alimentar | Ciências</title>
  <style>
    
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Inter', system-ui, -apple-system, sans-serif;
  background: linear-gradient(135deg, #fefce8 0%, #fef08a 50%, #fde047 100%);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 20px;
  color: #713f12;
}
.game-card {
  background: #ffffff;
  border-radius: 20px;
  box-shadow: 0 15px 35px rgba(113, 63, 18, 0.15);
  padding: 28px;
  max-width: 560px;
  width: 100%;
  text-align: center;
  border: 2px solid #facc15;
}
.header-badge {
  display: inline-block;
  background: #fef08a;
  color: #854d0e;
  padding: 6px 14px;
  border-radius: 20px;
  font-weight: 600;
  font-size: 13px;
  margin-bottom: 12px;
}
h1 { font-size: 26px; color: #713f12; margin-bottom: 8px; }
p.desc { font-size: 14px; color: #4b5563; margin-bottom: 20px; }
.stats-bar {
  display: flex;
  justify-content: space-around;
  background: #fefce8;
  border-radius: 12px;
  padding: 12px;
  margin-bottom: 20px;
  border: 1px solid #fef08a;
}
.stat-box { font-size: 14px; font-weight: 600; color: #a16207; }
.stat-val { font-size: 20px; font-weight: 700; color: #713f12; display: block; }
.btn-action {
  background: #eab308;
  color: #422006;
  border: none;
  padding: 12px 24px;
  font-size: 15px;
  font-weight: 700;
  border-radius: 10px;
  cursor: pointer;
  transition: all 0.2s;
  text-decoration: none;
  display: inline-block;
}
.btn-action:hover { background: #ca8a04; transform: translateY(-1px); color: white; }
.back-link {
  margin-top: 20px;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  color: #713f12;
  text-decoration: none;
  font-size: 13px;
  font-weight: 600;
}
.back-link:hover { text-decoration: underline; }

    .chain-slots {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }
    .slot {
      background: #fefce8;
      border: 2px dashed #ca8a04;
      border-radius: 12px;
      width: 100px;
      height: 70px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 700;
      color: #854d0e;
    }
    .slot.filled {
      background: #dcfce7;
      border: 2px solid #22c55e;
      color: #14532d;
    }
    .arrow { font-size: 20px; font-weight: 800; color: #ca8a04; }
    .pieces-container {
      display: flex;
      gap: 8px;
      justify-content: center;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }
    .piece-btn {
      background: #ffffff;
      border: 2px solid #facc15;
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 14px;
      font-weight: 700;
      color: #713f12;
      cursor: pointer;
      transition: all 0.15s;
    }
    .piece-btn:hover { background: #fef08a; transform: translateY(-2px); }
    .piece-btn.used { opacity: 0.3; pointer-events: none; }
  </style>
</head>
<body>
  <div class="game-card">
    <span class="header-badge">🌿 Ecologia & Natureza</span>
    <h1>Cadeia Alimentar</h1>
    <p class="desc">Clique nos seres vivos na ordem correta do fluxo de energia!</p>

    <div class="chain-slots">
      <div class="slot" id="slot-0">Produtor</div>
      <div class="arrow">&rarr;</div>
      <div class="slot" id="slot-1">Cons. Primário</div>
      <div class="arrow">&rarr;</div>
      <div class="slot" id="slot-2">Cons. Secundário</div>
      <div class="arrow">&rarr;</div>
      <div class="slot" id="slot-3">Cons. Terciário</div>
    </div>

    <div class="pieces-container" id="pieces"></div>
    <div id="status" style="font-weight: 700; min-height: 24px; color: #854d0e; margin-bottom: 12px;"></div>

    <button class="btn-action" onclick="resetChain()">Recomeçar Cadeia</button>
    <br>
    <a href="../../projetos.html" class="back-link">← Voltar ao Portfólio</a>
  </div>

  <script>
    
const AudioCtx = window.AudioContext || window.webkitAudioContext;
let ctx;
function playSound(type) {
  try {
    if (!ctx) ctx = new AudioCtx();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain);
    gain.connect(ctx.destination);
    if (type === 'correct') {
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(523.25, ctx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(783.99, ctx.currentTime + 0.15);
      gain.gain.setValueAtTime(0.3, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.25);
      osc.start();
      osc.stop(ctx.currentTime + 0.25);
    } else {
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(220, ctx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(130, ctx.currentTime + 0.2);
      gain.gain.setValueAtTime(0.3, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.25);
      osc.start();
      osc.stop(ctx.currentTime + 0.25);
    }
  } catch(e) {}
}

    const correctOrder = [
      { name: '🌱 Planta (Capim)', label: 'Produtor' },
      { name: '🦗 Gafanhoto', label: 'Consumidor 1º' },
      { name: '🐸 Sapo', label: 'Consumidor 2º' },
      { name: '🦅 Gavião', label: 'Consumidor 3º' }
    ];

    let currentSlot = 0;

    function initGame() {
      currentSlot = 0;
      document.getElementById('status').textContent = 'Selecione o Produtor para começar!';
      for (let i = 0; i < 4; i++) {
        const slot = document.getElementById('slot-' + i);
        slot.textContent = ['Produtor', 'Cons. Primário', 'Cons. Secundário', 'Cons. Terciário'][i];
        slot.classList.remove('filled');
      }

      const pBox = document.getElementById('pieces');
      pBox.innerHTML = '';
      const shuffled = [...correctOrder].sort(() => Math.random() - 0.5);

      shuffled.forEach(item => {
        const btn = document.createElement('button');
        btn.className = 'piece-btn';
        btn.textContent = item.name;
        btn.onclick = () => {
          if (item.name === correctOrder[currentSlot].name) {
            playSound('correct');
            btn.classList.add('used');
            const slot = document.getElementById('slot-' + currentSlot);
            slot.textContent = item.name;
            slot.classList.add('filled');
            currentSlot++;
            if (currentSlot === 4) {
              document.getElementById('status').textContent = '🎉 Perfeito! A cadeia ecológica está em equilíbrio!';
            } else {
              document.getElementById('status').textContent = 'Muito bem! Escolha o próximo nível trófico.';
            }
          } else {
            playSound('wrong');
            document.getElementById('status').textContent = 'Ops! Não é essa ordem. Tente outro!';
          }
        };
        pBox.appendChild(btn);
      });
    }

    function resetChain() {
      initGame();
    }

    initGame();
  </script>
</body>
</html>
