<svg xmlns="http://www.w3.org/2000/svg" width="350" height="150" viewBox="0 0 350 150" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdfbfd" />
      <stop offset="100%" stop-color="#eddced" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.1" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="350" height="150" rx="10" fill="url(#bgGrad)" stroke="#c4a6e9" stroke-width="1.5" />

  <!-- Certificate Paper illustration -->
  <g transform="translate(30, 20)" filter="url(#shadow)">
    <rect width="80" height="110" rx="4" fill="#ffffff" stroke="#e2d4e8" stroke-width="1.5" />
    <!-- Certificate lines -->
    <rect x="12" y="15" width="40" height="6" rx="2" fill="#7d6b82" />
    <rect x="12" y="30" width="56" height="3" rx="1.5" fill="#c4b5c9" />
    <rect x="12" y="40" width="50" height="3" rx="1.5" fill="#c4b5c9" />
    <rect x="12" y="50" width="56" height="3" rx="1.5" fill="#c4b5c9" />
    <rect x="12" y="60" width="38" height="3" rx="1.5" fill="#c4b5c9" />
    <!-- Gold Ribbon/Badge -->
    <circle cx="58" cy="85" r="12" fill="url(#goldGrad)" />
    <path d="M54 95 L50 106 L58 102 L66 106 L62 95 Z" fill="#d97706" />
    <circle cx="58" cy="85" r="8" fill="#fef3c7" />
    <path d="M55 85 L57 87 L62 82" stroke="#d97706" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Google Drive Folder Icon & Text -->
  <g transform="translate(130, 32)">
    <!-- Google Drive icon -->
    <g transform="translate(0, 0) scale(0.9)">
      <polygon points="18,3 32,27 14,27 0,3" fill="#34a853" />
      <polygon points="18,3 36,34 22,34 4,3" fill="#4285f4" opacity="0.85" />
      <polygon points="14,27 32,27 23,42 5,42" fill="#fbbc05" />
      <polygon points="0,3 14,27 5,42 0,33" fill="#ea4335" />
    </g>

    <text x="42" y="16" font-family="'Inter', sans-serif" font-size="13" font-weight="700" fill="#2b1b32">Pasta de Certificados</text>
    <text x="42" y="32" font-family="'Inter', sans-serif" font-size="11" font-weight="500" fill="#6d5875">Google Drive • Acesso Completo</text>

    <!-- Trilhas & UX tags -->
    <rect x="0" y="52" width="105" height="18" rx="9" fill="#e9d8ea" stroke="#8d7296" stroke-width="0.8" />
    <text x="52" y="64" font-family="'Inter', sans-serif" font-size="9.5" font-weight="600" fill="#47324f" text-anchor="middle">🎓 Programa Trilhas</text>

    <rect x="112" y="52" width="80" height="18" rx="9" fill="#e9d8ea" stroke="#8d7296" stroke-width="0.8" />
    <text x="152" y="64" font-family="'Inter', sans-serif" font-size="9.5" font-weight="600" fill="#47324f" text-anchor="middle">✨ UX & Tech</text>

    <!-- Open indicator -->
    <text x="0" y="90" font-family="'Inter', sans-serif" font-size="11.5" font-weight="600" fill="#7a3e87">Clique para abrir no Google Drive ↗</text>
  </g>
</svg>
