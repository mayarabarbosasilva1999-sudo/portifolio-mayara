<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Par Perfeito | Sinônimos e Antônimos</title>
  <style>
    
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Inter', system-ui, -apple-system, sans-serif;
  background: linear-gradient(135deg, #eff6ff 0%, #dbeafe 50%, #bfdbfe 100%);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 20px;
  color: #1e3a8a;
}
.game-card {
  background: #ffffff;
  border-radius: 20px;
  box-shadow: 0 15px 35px rgba(30, 58, 138, 0.15);
  padding: 28px;
  max-width: 540px;
  width: 100%;
  text-align: center;
  border: 2px solid #93c5fd;
}
.header-badge {
  display: inline-block;
  background: #dbeafe;
  color: #1d4ed8;
  padding: 6px 14px;
  border-radius: 20px;
  font-weight: 600;
  font-size: 13px;
  margin-bottom: 12px;
}
h1 { font-size: 26px; color: #1e3a8a; margin-bottom: 8px; }
p.desc { font-size: 14px; color: #4b5563; margin-bottom: 20px; }
.stats-bar {
  display: flex;
  justify-content: space-around;
  background: #eff6ff;
  border-radius: 12px;
  padding: 12px;
  margin-bottom: 20px;
  border: 1px solid #bfdbfe;
}
.stat-box { font-size: 14px; font-weight: 600; color: #2563eb; }
.stat-val { font-size: 20px; font-weight: 700; color: #1e3a8a; display: block; }
.btn-action {
  background: #2563eb;
  color: white;
  border: none;
  padding: 12px 24px;
  font-size: 15px;
  font-weight: 600;
  border-radius: 10px;
  cursor: pointer;
  transition: all 0.2s;
  text-decoration: none;
  display: inline-block;
}
.btn-action:hover { background: #1d4ed8; transform: translateY(-1px); }
.back-link {
  margin-top: 20px;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  color: #1e3a8a;
  text-decoration: none;
  font-size: 13px;
  font-weight: 600;
}
.back-link:hover { text-decoration: underline; }

    .cards-board {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 24px;
    }
    .match-card {
      background: #eff6ff;
      border: 2px solid #93c5fd;
      border-radius: 12px;
      padding: 16px 8px;
      font-size: 15px;
      font-weight: 700;
      color: #1e40af;
      cursor: pointer;
      transition: all 0.2s ease;
      user-select: none;
    }
    .match-card:hover { transform: translateY(-2px); background: #dbeafe; }
    .match-card.active { background: #3b82f6; color: white; border-color: #1d4ed8; }
    .match-card.matched { background: #86efac; color: #14532d; border-color: #22c55e; pointer-events: none; }
  </style>
</head>
<body>
  <div class="game-card">
    <span class="header-badge">🤝 Vocabulário & Relações</span>
    <h1>Par Perfeito: Sinônimos</h1>
    <p class="desc">Clique em duas palavras que possuem o mesmo significado (sinônimos)!</p>

    <div class="stats-bar">
      <div class="stat-box">Pares Encontrados<span class="stat-val" id="pairs">0/3</span></div>
      <div class="stat-box">Tentativas<span class="stat-val" id="tries">0</span></div>
      <div class="stat-box">Pontos<span class="stat-val" id="score">0</span></div>
    </div>

    <div class="cards-board" id="board"></div>

    <a href="../../projetos.html" class="back-link">← Voltar ao Portfólio</a>
  </div>

  <script>
    
const AudioCtx = window.AudioContext || window.webkitAudioContext;
let ctx;
function playSound(type) {
  try {
    if (!ctx) ctx = new AudioCtx();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain);
    gain.connect(ctx.destination);
    if (type === 'correct') {
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(523.25, ctx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(783.99, ctx.currentTime + 0.15);
      gain.gain.setValueAtTime(0.3, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.25);
      osc.start();
      osc.stop(ctx.currentTime + 0.25);
    } else {
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(220, ctx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(130, ctx.currentTime + 0.2);
      gain.gain.setValueAtTime(0.3, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.25);
      osc.start();
      osc.stop(ctx.currentTime + 0.25);
    }
  } catch(e) {}
}

    const pairs = [
      { id: 1, text: 'Rápido' },
      { id: 1, text: 'Veloz' },
      { id: 2, text: 'Alegre' },
      { id: 2, text: 'Contente' },
      { id: 3, text: 'Belo' },
      { id: 3, text: 'Bonito' }
    ];

    let firstCard = null, tries = 0, matchedCount = 0, score = 0;

    function initBoard() {
      const board = document.getElementById('board');
      board.innerHTML = '';
      const shuffled = [...pairs].sort(() => Math.random() - 0.5);

      shuffled.forEach(item => {
        const card = document.createElement('div');
        card.className = 'match-card';
        card.textContent = item.text;
        card.dataset.id = item.id;
        card.onclick = () => selectCard(card, item.id);
        board.appendChild(card);
      });
    }

    function selectCard(card, id) {
      if (card.classList.contains('matched') || card === firstCard) return;

      card.classList.add('active');

      if (!firstCard) {
        firstCard = card;
      } else {
        tries++;
        document.getElementById('tries').textContent = tries;
        if (firstCard.dataset.id === card.dataset.id) {
          playSound('correct');
          firstCard.classList.add('matched');
          card.classList.add('matched');
          matchedCount++;
          score += 30;
          document.getElementById('pairs').textContent = matchedCount + '/3';
          document.getElementById('score').textContent = score;
          firstCard = null;
          if (matchedCount === 3) {
            setTimeout(() => alert('🎉 Parabéns! Todos os sinônimos foram conectados com sucesso!'), 300);
          }
        } else {
          playSound('wrong');
          setTimeout(() => {
            firstCard.classList.remove('active');
            card.classList.remove('active');
            firstCard = null;
          }, 600);
        }
      }
    }

    initBoard();
  </script>
</body>
</html>
