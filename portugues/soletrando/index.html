<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acerte a Palavra | Soletrando</title>
  <style>
    
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Inter', system-ui, -apple-system, sans-serif;
  background: linear-gradient(135deg, #eff6ff 0%, #dbeafe 50%, #bfdbfe 100%);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 20px;
  color: #1e3a8a;
}
.game-card {
  background: #ffffff;
  border-radius: 20px;
  box-shadow: 0 15px 35px rgba(30, 58, 138, 0.15);
  padding: 28px;
  max-width: 540px;
  width: 100%;
  text-align: center;
  border: 2px solid #93c5fd;
}
.header-badge {
  display: inline-block;
  background: #dbeafe;
  color: #1d4ed8;
  padding: 6px 14px;
  border-radius: 20px;
  font-weight: 600;
  font-size: 13px;
  margin-bottom: 12px;
}
h1 { font-size: 26px; color: #1e3a8a; margin-bottom: 8px; }
p.desc { font-size: 14px; color: #4b5563; margin-bottom: 20px; }
.stats-bar {
  display: flex;
  justify-content: space-around;
  background: #eff6ff;
  border-radius: 12px;
  padding: 12px;
  margin-bottom: 20px;
  border: 1px solid #bfdbfe;
}
.stat-box { font-size: 14px; font-weight: 600; color: #2563eb; }
.stat-val { font-size: 20px; font-weight: 700; color: #1e3a8a; display: block; }
.btn-action {
  background: #2563eb;
  color: white;
  border: none;
  padding: 12px 24px;
  font-size: 15px;
  font-weight: 600;
  border-radius: 10px;
  cursor: pointer;
  transition: all 0.2s;
  text-decoration: none;
  display: inline-block;
}
.btn-action:hover { background: #1d4ed8; transform: translateY(-1px); }
.back-link {
  margin-top: 20px;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  color: #1e3a8a;
  text-decoration: none;
  font-size: 13px;
  font-weight: 600;
}
.back-link:hover { text-decoration: underline; }

    .clue-box {
      background: #eff6ff;
      border: 2px dashed #93c5fd;
      border-radius: 12px;
      padding: 14px;
      font-size: 15px;
      color: #1e40af;
      margin-bottom: 20px;
    }
    .word-display {
      font-size: 32px;
      letter-spacing: 8px;
      font-weight: 800;
      color: #1e3a8a;
      margin-bottom: 24px;
      min-height: 48px;
    }
    .keyboard {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      justify-content: center;
      max-width: 440px;
      margin: 0 auto 20px auto;
    }
    .key-btn {
      width: 38px;
      height: 40px;
      border-radius: 8px;
      background: #f1f5f9;
      border: 1px solid #cbd5e1;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      color: #1e293b;
      transition: all 0.15s;
    }
    .key-btn:hover { background: #dbeafe; border-color: #3b82f6; }
    .key-btn.disabled { opacity: 0.35; pointer-events: none; }
  </style>
</head>
<body>
  <div class="game-card">
    <span class="header-badge">🔤 Soletrando Divertido</span>
    <h1>Acerte a Palavra</h1>
    <p class="desc">Adivinhe as letras para completar a palavra misteriosa!</p>

    <div class="stats-bar">
      <div class="stat-box">Pontos<span class="stat-val" id="score">0</span></div>
      <div class="stat-box">Vidas<span class="stat-val" id="lives">❤️❤️❤️❤️❤️</span></div>
      <div class="stat-box">Palavra<span class="stat-val" id="progress">1/5</span></div>
    </div>

    <div class="clue-box" id="clue">Dica: Dispositivo eletrônico utilizado para programar.</div>
    <div class="word-display" id="word-display">_ _ _ _ _ _ _ _ _ _</div>
    <div class="keyboard" id="keyboard"></div>

    <a href="../../projetos.html" class="back-link">← Voltar ao Portfólio</a>
  </div>

  <script>
    
const AudioCtx = window.AudioContext || window.webkitAudioContext;
let ctx;
function playSound(type) {
  try {
    if (!ctx) ctx = new AudioCtx();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain);
    gain.connect(ctx.destination);
    if (type === 'correct') {
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(523.25, ctx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(783.99, ctx.currentTime + 0.15);
      gain.gain.setValueAtTime(0.3, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.25);
      osc.start();
      osc.stop(ctx.currentTime + 0.25);
    } else {
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(220, ctx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(130, ctx.currentTime + 0.2);
      gain.gain.setValueAtTime(0.3, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.25);
      osc.start();
      osc.stop(ctx.currentTime + 0.25);
    }
  } catch(e) {}
}

    const wordsList = [
      { word: 'COMPUTADOR', clue: '💡 Dispositivo eletrônico que você usa para navegar e programar.' },
      { word: 'INTERNET', clue: '💡 Rede mundial de computadores interconectados.' },
      { word: 'ALGORITMO', clue: '💡 Sequência de passos lógicos para resolver um problema.' },
      { word: 'TECLADO', clue: '💡 Periférico usado para digitar letras e códigos.' },
      { word: 'PORTFOLIO', clue: '💡 Conjunto de trabalhos e projetos de um profissional.' }
    ];

    let currentIdx = 0, score = 0, lives = 5, guessed = new Set();

    function renderGame() {
      const current = wordsList[currentIdx];
      document.getElementById('clue').textContent = current.clue;
      document.getElementById('progress').textContent = (currentIdx + 1) + '/' + wordsList.length;
      document.getElementById('lives').textContent = '❤️'.repeat(lives) || '💀';
      document.getElementById('score').textContent = score;

      const display = current.word.split('').map(l => guessed.has(l) ? l : '_').join(' ');
      document.getElementById('word-display').textContent = display;

      if (!display.includes('_')) {
        playSound('correct');
        score += 50;
        document.getElementById('score').textContent = score;
        setTimeout(() => {
          if (currentIdx + 1 < wordsList.length) {
            currentIdx++;
            guessed.clear();
            renderKeyboard();
            renderGame();
          } else {
            alert('🎉 Parabéns! Você completou todas as palavras!');
          }
        }, 800);
      }
    }

    function renderKeyboard() {
      const kb = document.getElementById('keyboard');
      kb.innerHTML = '';
      'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('').forEach(letter => {
        const btn = document.createElement('button');
        btn.className = 'key-btn';
        btn.textContent = letter;
        btn.onclick = () => {
          btn.classList.add('disabled');
          guessed.add(letter);
          if (wordsList[currentIdx].word.includes(letter)) {
            playSound('correct');
          } else {
            playSound('wrong');
            lives--;
            if (lives <= 0) {
              alert('Fim de jogo! A palavra era ' + wordsList[currentIdx].word);
              lives = 5;
              currentIdx = 0;
              guessed.clear();
              renderKeyboard();
            }
          }
          renderGame();
        };
        kb.appendChild(btn);
      });
    }

    renderKeyboard();
    renderGame();
  </script>
</body>
</html>
