<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Caça-Palavras | Língua Portuguesa</title>
  <style>
    
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Inter', system-ui, -apple-system, sans-serif;
  background: linear-gradient(135deg, #eff6ff 0%, #dbeafe 50%, #bfdbfe 100%);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 20px;
  color: #1e3a8a;
}
.game-card {
  background: #ffffff;
  border-radius: 20px;
  box-shadow: 0 15px 35px rgba(30, 58, 138, 0.15);
  padding: 28px;
  max-width: 540px;
  width: 100%;
  text-align: center;
  border: 2px solid #93c5fd;
}
.header-badge {
  display: inline-block;
  background: #dbeafe;
  color: #1d4ed8;
  padding: 6px 14px;
  border-radius: 20px;
  font-weight: 600;
  font-size: 13px;
  margin-bottom: 12px;
}
h1 { font-size: 26px; color: #1e3a8a; margin-bottom: 8px; }
p.desc { font-size: 14px; color: #4b5563; margin-bottom: 20px; }
.stats-bar {
  display: flex;
  justify-content: space-around;
  background: #eff6ff;
  border-radius: 12px;
  padding: 12px;
  margin-bottom: 20px;
  border: 1px solid #bfdbfe;
}
.stat-box { font-size: 14px; font-weight: 600; color: #2563eb; }
.stat-val { font-size: 20px; font-weight: 700; color: #1e3a8a; display: block; }
.btn-action {
  background: #2563eb;
  color: white;
  border: none;
  padding: 12px 24px;
  font-size: 15px;
  font-weight: 600;
  border-radius: 10px;
  cursor: pointer;
  transition: all 0.2s;
  text-decoration: none;
  display: inline-block;
}
.btn-action:hover { background: #1d4ed8; transform: translateY(-1px); }
.back-link {
  margin-top: 20px;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  color: #1e3a8a;
  text-decoration: none;
  font-size: 13px;
  font-weight: 600;
}
.back-link:hover { text-decoration: underline; }

    .words-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      margin-bottom: 16px;
    }
    .word-badge {
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      padding: 6px 12px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 700;
      color: #1e40af;
    }
    .word-badge.found {
      background: #22c55e;
      color: white;
      border-color: #16a34a;
      text-decoration: line-through;
    }
    .grid-container {
      display: grid;
      grid-template-columns: repeat(7, 40px);
      gap: 5px;
      justify-content: center;
      margin-bottom: 20px;
    }
    .grid-cell {
      width: 40px;
      height: 40px;
      background: #f8fafc;
      border: 2px solid #cbd5e1;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 17px;
      font-weight: 700;
      color: #1e293b;
      cursor: pointer;
      user-select: none;
      transition: all 0.15s ease;
    }
    .grid-cell:hover { background: #dbeafe; }
    .grid-cell.selected { background: #3b82f6; color: white; border-color: #1d4ed8; }
    .grid-cell.found { background: #86efac; color: #14532d; border-color: #22c55e; }
  </style>
</head>
<body>
  <div class="game-card">
    <span class="header-badge">📖 Alfabetização & Vocabulário</span>
    <h1>Caça-Palavras</h1>
    <p class="desc">Encontre as 4 palavras escondidas na grade de letras!</p>

    <div class="words-list" id="words-container">
      <span class="word-badge" id="wb-LIVRO">LIVRO</span>
      <span class="word-badge" id="wb-POEMA">POEMA</span>
      <span class="word-badge" id="wb-CANETA">CANETA</span>
      <span class="word-badge" id="wb-PORTA">PORTA</span>
    </div>

    <div class="grid-container" id="grid"></div>
    <div id="feedback" style="font-weight: 700; min-height: 24px; color: #1e40af; margin-bottom: 10px;"></div>

    <a href="../../projetos.html" class="back-link">← Voltar ao Portfólio</a>
  </div>

  <script>
    
const AudioCtx = window.AudioContext || window.webkitAudioContext;
let ctx;
function playSound(type) {
  try {
    if (!ctx) ctx = new AudioCtx();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain);
    gain.connect(ctx.destination);
    if (type === 'correct') {
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(523.25, ctx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(783.99, ctx.currentTime + 0.15);
      gain.gain.setValueAtTime(0.3, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.25);
      osc.start();
      osc.stop(ctx.currentTime + 0.25);
    } else {
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(220, ctx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(130, ctx.currentTime + 0.2);
      gain.gain.setValueAtTime(0.3, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.25);
      osc.start();
      osc.stop(ctx.currentTime + 0.25);
    }
  } catch(e) {}
}

    const gridLetters = [
      ['L','I','V','R','O','X','Z'],
      ['P','O','E','M','A','B','W'],
      ['C','A','N','E','T','A','K'],
      ['P','O','R','T','A','J','M'],
      ['S','A','B','E','R','F','Q'],
      ['V','I','D','A','L','U','Z'],
      ['A','M','O','R','P','A','Z']
    ];

    const targets = {
      'LIVRO': [[0,0],[0,1],[0,2],[0,3],[0,4]],
      'POEMA': [[1,0],[1,1],[1,2],[1,3],[1,4]],
      'CANETA': [[2,0],[2,1],[2,2],[2,3],[2,4],[2,5]],
      'PORTA': [[3,0],[3,1],[3,2],[3,3],[3,4]]
    };

    let selected = [];
    let foundCount = 0;

    const gridEl = document.getElementById('grid');
    for (let r = 0; r < 7; r++) {
      for (let c = 0; c < 7; c++) {
        const cell = document.createElement('div');
        cell.className = 'grid-cell';
        cell.textContent = gridLetters[r][c];
        cell.dataset.r = r;
        cell.dataset.c = c;
        cell.onclick = () => toggleCell(r, c, cell);
        gridEl.appendChild(cell);
      }
    }

    function toggleCell(r, c, el) {
      const idx = selected.findIndex(p => p[0] === r && p[1] === c);
      if (idx >= 0) {
        selected.splice(idx, 1);
        el.classList.remove('selected');
      } else {
        selected.push([r, c]);
        el.classList.add('selected');
      }
      checkWord();
    }

    function checkWord() {
      for (let word in targets) {
        const coords = targets[word];
        if (coords.length === selected.length) {
          const match = coords.every(pt => selected.some(s => s[0] === pt[0] && s[1] === pt[1]));
          if (match) {
            playSound('correct');
            document.getElementById('wb-' + word).classList.add('found');
            document.querySelectorAll('.grid-cell.selected').forEach(c => {
              c.classList.remove('selected');
              c.classList.add('found');
            });
            selected = [];
            foundCount++;
            document.getElementById('feedback').textContent = 'Muito bem! Você encontrou ' + word + '! ✨';
            if (foundCount === 4) {
              document.getElementById('feedback').textContent = '🎉 Parabéns! Você encontrou todas as palavras!';
            }
            return;
          }
        }
      }
    }
  </script>
</body>
</html>
