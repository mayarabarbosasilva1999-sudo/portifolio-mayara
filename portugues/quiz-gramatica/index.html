<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz de Ortografia | Português</title>
  <style>
    
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Inter', system-ui, -apple-system, sans-serif;
  background: linear-gradient(135deg, #eff6ff 0%, #dbeafe 50%, #bfdbfe 100%);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 20px;
  color: #1e3a8a;
}
.game-card {
  background: #ffffff;
  border-radius: 20px;
  box-shadow: 0 15px 35px rgba(30, 58, 138, 0.15);
  padding: 28px;
  max-width: 540px;
  width: 100%;
  text-align: center;
  border: 2px solid #93c5fd;
}
.header-badge {
  display: inline-block;
  background: #dbeafe;
  color: #1d4ed8;
  padding: 6px 14px;
  border-radius: 20px;
  font-weight: 600;
  font-size: 13px;
  margin-bottom: 12px;
}
h1 { font-size: 26px; color: #1e3a8a; margin-bottom: 8px; }
p.desc { font-size: 14px; color: #4b5563; margin-bottom: 20px; }
.stats-bar {
  display: flex;
  justify-content: space-around;
  background: #eff6ff;
  border-radius: 12px;
  padding: 12px;
  margin-bottom: 20px;
  border: 1px solid #bfdbfe;
}
.stat-box { font-size: 14px; font-weight: 600; color: #2563eb; }
.stat-val { font-size: 20px; font-weight: 700; color: #1e3a8a; display: block; }
.btn-action {
  background: #2563eb;
  color: white;
  border: none;
  padding: 12px 24px;
  font-size: 15px;
  font-weight: 600;
  border-radius: 10px;
  cursor: pointer;
  transition: all 0.2s;
  text-decoration: none;
  display: inline-block;
}
.btn-action:hover { background: #1d4ed8; transform: translateY(-1px); }
.back-link {
  margin-top: 20px;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  color: #1e3a8a;
  text-decoration: none;
  font-size: 13px;
  font-weight: 600;
}
.back-link:hover { text-decoration: underline; }

    .quiz-question {
      background: #eff6ff;
      border: 2px solid #93c5fd;
      border-radius: 14px;
      padding: 20px;
      font-size: 18px;
      font-weight: 700;
      color: #1e3a8a;
      margin-bottom: 20px;
    }
    .options-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 20px;
    }
    .quiz-btn {
      background: #ffffff;
      border: 2px solid #bfdbfe;
      border-radius: 12px;
      padding: 14px 18px;
      font-size: 16px;
      font-weight: 600;
      color: #1e40af;
      text-align: left;
      cursor: pointer;
      transition: all 0.2s;
    }
    .quiz-btn:hover { background: #dbeafe; transform: translateX(4px); }
    .quiz-btn.correct { background: #22c55e !important; color: white !important; border-color: #16a34a !important; }
    .quiz-btn.wrong { background: #ef4444 !important; color: white !important; border-color: #dc2626 !important; }
    .explanation-box {
      font-size: 14px;
      color: #15803d;
      background: #dcfce7;
      padding: 10px 14px;
      border-radius: 10px;
      margin-bottom: 16px;
      display: none;
    }
  </style>
</head>
<body>
  <div class="game-card">
    <span class="header-badge">📝 Gramática & Ortografia</span>
    <h1>Quiz de Português</h1>
    <p class="desc">Qual é a forma correta de preencher a frase?</p>

    <div class="stats-bar">
      <div class="stat-box">Questão<span class="stat-val" id="q-num">1/5</span></div>
      <div class="stat-box">Acertos<span class="stat-val" id="hits">0</span></div>
      <div class="stat-box">Pontuação<span class="stat-val" id="score">0</span></div>
    </div>

    <div class="quiz-question" id="question">Carregando...</div>
    <div class="options-list" id="options"></div>
    <div class="explanation-box" id="explanation"></div>

    <a href="../../projetos.html" class="back-link">← Voltar ao Portfólio</a>
  </div>

  <script>
    
const AudioCtx = window.AudioContext || window.webkitAudioContext;
let ctx;
function playSound(type) {
  try {
    if (!ctx) ctx = new AudioCtx();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain);
    gain.connect(ctx.destination);
    if (type === 'correct') {
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(523.25, ctx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(783.99, ctx.currentTime + 0.15);
      gain.gain.setValueAtTime(0.3, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.25);
      osc.start();
      osc.stop(ctx.currentTime + 0.25);
    } else {
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(220, ctx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(130, ctx.currentTime + 0.2);
      gain.gain.setValueAtTime(0.3, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.25);
      osc.start();
      osc.stop(ctx.currentTime + 0.25);
    }
  } catch(e) {}
}

    const questions = [
      {
        q: 'Gostaria de ir à praia, _____ está chovendo muito.',
        options: ['mas', 'mais'],
        correct: 0,
        tip: '💡 "Mas" indica oposição/contrariedade (porém). "Mais" indica quantidade.'
      },
      {
        q: 'Você não compareceu ontem _____ você estava doente?',
        options: ['porque', 'por que', 'por quê', 'porquê'],
        correct: 1,
        tip: '💡 "Por que" separado e sem acento é usado em início/meio de perguntas.'
      },
      {
        q: 'O aluno se comportou muito ____ durante a aula.',
        options: ['mal', 'mau'],
        correct: 0,
        tip: '💡 "Mal" é o oposto de bem. "Mau" é o oposto de bom.'
      },
      {
        q: 'Não sei _____ você colocou as chaves de casa.',
        options: ['onde', 'aonde'],
        correct: 0,
        tip: '💡 "Onde" indica lugar fixo. "Aonde" indica movimento/destino.'
      },
      {
        q: 'No ano passado, _____ muitas novidades no curso.',
        options: ['houve', 'houveram'],
        correct: 0,
        tip: '💡 O verbo "haver" no sentido de existir ou acontecer é impessoal e fica no singular!'
      }
    ];

    let current = 0, hits = 0, score = 0, locked = false;

    function renderQuestion() {
      locked = false;
      const q = questions[current];
      document.getElementById('q-num').textContent = (current + 1) + '/' + questions.length;
      document.getElementById('question').textContent = q.q;
      const expBox = document.getElementById('explanation');
      expBox.style.display = 'none';

      const optContainer = document.getElementById('options');
      optContainer.innerHTML = '';
      q.options.forEach((opt, idx) => {
        const btn = document.createElement('button');
        btn.className = 'quiz-btn';
        btn.textContent = opt;
        btn.onclick = () => {
          if (locked) return;
          locked = true;
          expBox.textContent = q.tip;
          expBox.style.display = 'block';

          if (idx === q.correct) {
            playSound('correct');
            btn.classList.add('correct');
            hits++;
            score += 25;
            document.getElementById('hits').textContent = hits;
            document.getElementById('score').textContent = score;
          } else {
            playSound('wrong');
            btn.classList.add('wrong');
          }

          setTimeout(() => {
            if (current + 1 < questions.length) {
              current++;
              renderQuestion();
            } else {
              alert('🎉 Quiz Concluído! Você acertou ' + hits + ' de ' + questions.length + ' questões!');
            }
          }, 1500);
        };
        optContainer.appendChild(btn);
      });
    }

    renderQuestion();
  </script>
</body>
</html>
